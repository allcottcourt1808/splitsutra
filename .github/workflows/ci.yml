# SplitSutra CI — docs/10-deployment.md, docs/20-test-automation-pipeline.md §5/§5a
#
# ── STAGE 1: ADVISORY (now → v1.0) ───────────────────────────────────────────────────────
# This workflow runs on every push and every PR, and **blocks nothing**. Branch protection
# is deliberately OFF through Phases 01–10: the codebase is churning, tests are written
# alongside the code they cover, and there is no deployed environment to protect.
#
# ⚠️ The failure mode to guard against is advisory mode decaying into permanently-ignored.
#    Two defences, both cheap:
#      1. The CI badge at the top of README.md — visible red is harder to skip than a tick
#         buried in the Actions tab.
#      2. Treat a red `main` as a same-day fix. Enforcement is social during Stage 1; the
#         habit is what makes the Stage 2 flip a formality instead of a cleanup project.
#
# Stage 2 (branch protection, `verify` as a required status check) is flipped on in
# checklists/phase-11-deploy.md, immediately before the launch tag.
#
# 🔴 DO NOT RENAME THE `verify` JOB. Phase 11 registers it as a required status check *by
#    name*. A rename after that point makes GitHub wait forever for a check that never
#    arrives, and PRs hang on "Expected — waiting for status". (docs/20 §5a, gotcha 2)

name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node, or `cache: pnpm` cannot find the store.
      # Version comes from `packageManager` in package.json — pinned in one place.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Active LTS. Node 20 went EOL 2026-04-30.
          cache: pnpm

      # REQUIRED — the Firestore and Auth emulators are Java processes. Wired up now even
      # though the emulator-backed suites arrive in Phase 02b/10, so it is one less thing to
      # debug on the day the rules tests land. (phase-01 §8)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      # Cheap → expensive, so a type error fails in under a minute instead of after a
      # six-minute E2E run.
      - run: pnpm typecheck
      - run: pnpm lint
      # Verifies the pre-commit secret scanner's own rules, NOT the repo's contents — a
      # credential has to be stopped at the commit, because once CI can see it the object is
      # already pushed and rotation is the only remedy. What decays silently is the scanner
      # itself: a regex edited into uselessness still exits 0 on every clean commit forever.
      - run: node scripts/scan-secrets.mjs --self-test
      # Cheapest gate in the list, and it was missing. `.prettierignore` had no entry for
      # firebase/functions/lib/, so `pnpm format:check` passed or failed locally depending
      # on whether you happened to have built recently — and CI never ran it, so nothing
      # caught that for the whole of Phase 01. Runs BEFORE build here on purpose: a
      # formatting failure should not cost a full build first.
      - run: pnpm format:check
      - run: pnpm depcruise # NFR-10: core stays platform-agnostic
      - run: pnpm test:unit # Phase 02b flips this to `pnpm test:unit --coverage`
      - run: pnpm build
      # 🔴 NFR-2, and the reason it was breached by 69 KB without anything going red.
      #
      # The step above has always run, so the bundle was rebuilt on every push — nothing ever
      # LOOKED at it. Vite's `chunkSizeWarningLimit: 300` printed a warning, warnings do not
      # fail a build, and the warning sat in the log of a green job. `firebaseui` +
      # `firebase/compat` shipped to every signed-in user for months on exactly that basis.
      #
      # Must stay AFTER `pnpm build` — it reads `apps/web/dist` and fails loudly if it is
      # absent, rather than passing by finding nothing to measure.
      - run: node scripts/bundle-budget.mjs

      # ── Enabled in Phase 02b / Phase 10, once the harnesses and suites exist ───────────
      # Uncomment together with the checklist item that creates them:
      #   test:rules, test:integration  -> checklists/phase-02b-testing-setup.md §5, §6
      #   test:e2e                      -> checklists/phase-02b-testing-setup.md §8
      #
      # - run: pnpm test:rules          # emulator-backed security rules
      # - run: pnpm test:integration    # emulator-backed Cloud Functions
      #
      # ⚠️ Cache the Playwright browsers or CI re-downloads ~400 MB on every run.
      # - uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # - run: pnpm exec playwright install --with-deps chromium
      # - run: pnpm test:e2e            # slowest, last

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts
          path: |
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: ignore
# ═══════════════════════════════════════════════════════════════════════════════════════════
# DEPLOY + SMOKE — Phase 11 only. See checklists/phase-11-deploy.md and docs/20 §5.
#
# Left commented out on purpose: every job below needs GCP/Firebase credentials that do not
# exist yet, and both Firebase projects are deliberately on the free Spark plan with no
# billing linked until Phase 11 (docs/08 §6). A deploy job wired up early is a job that
# fails on every push and trains you to ignore red.
#
# The `needs:` chain is the whole point — two workflows both triggered by `push` race each
# other, whereas `needs:` makes ordering a guarantee. Keep this shape when enabling:
